name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    name: Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Use upstream Electron mirrors
        run: |
          sed -i.bak '/electron_mirror/d;/electron_builder_binaries_mirror/d' .npmrc

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      # `pnpm build` runs typecheck first, so a type error fails the job. This
      # is deliberately a real gate: the release script used to run a bare
      # `tsc` against a references-only tsconfig, which compiled zero files and
      # let a broken typecheck reach main.
      - name: Typecheck & Build
        run: pnpm run build

      # A real gate: the tree is lint-clean, so any new finding fails the job.
      - name: Lint
        run: pnpm run lint
