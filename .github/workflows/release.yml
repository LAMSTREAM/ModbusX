name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing should not cancel the artifacts of the others.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows x64
          - os: macos-latest
            name: macOS x64 + arm64
          - os: ubuntu-latest
            name: Linux x64

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Verify tag matches package.json version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          echo "tag=$TAG package.json=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG"
            exit 1
          fi

      - name: Use upstream Electron mirrors
        shell: bash
        # .npmrc pins npmmirror.com, which is right for local development in
        # China but slow and rate-limited from GitHub's runners. Strip it here
        # so CI pulls Electron and the builder binaries from upstream.
        run: |
          sed -i.bak '/electron_mirror/d;/electron_builder_binaries_mirror/d' .npmrc
          cat .npmrc

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build & Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No signing certificate is configured; without this, electron-builder
          # tries to sign with any identity it finds in the runner keychain.
          CSC_IDENTITY_AUTO_DISCOVERY: false
        # No platform flag: electron-builder targets the host platform, which is
        # what each matrix leg is for.
        run: pnpm run release
